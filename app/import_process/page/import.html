<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知流 RAG · 文件导入</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #1e2235;
      --text-secondary: #5a6178;
      --text-muted: #949aae;
      --accent: #0ea882;
      --accent-light: #14c99b;
      --accent-dark: #0b8a6a;
      --accent-glow: rgba(14,168,130,.12);
      --border: #e6e9f0;
      --shadow-sm: 0 1px 3px rgba(16,24,48,.05);
      --shadow-md: 0 8px 22px rgba(16,24,48,.08);
      --shadow-lg: 0 16px 40px rgba(16,24,48,.10);
      --radius: 12px;
      --radius-lg: 18px;
      --orange: #f59e0b;
      --blue: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
    }

    * { box-sizing:border-box }

    body {
      margin:0;
      font-family: "Inter", "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex; align-items:flex-start; justify-content:center;
      padding:32px 16px;
    }

    .container {
      width:100%; max-width:820px;
      background:var(--surface);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow-lg);
      border:1px solid var(--border);
      padding:0;
      overflow:hidden;
    }

    /* ---- 头部 ---- */
    .header {
      padding:28px 32px 20px;
      text-align:center;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, rgba(14,168,130,.04), transparent);
    }
    .logo-mark {
      display:inline-flex; align-items:center; justify-content:center;
      width:52px; height:52px;
      background:linear-gradient(135deg, var(--accent), var(--accent-light));
      border-radius:14px; margin-bottom:14px;
      box-shadow:0 8px 22px var(--accent-glow);
    }
    .logo-mark span { font-size:26px; color:#fff; font-weight:700; }
    .header h1 { margin:0 0 6px; font-size:22px; font-weight:700; letter-spacing:-.01em; }
    .header p { margin:0; font-size:13.5px; color:var(--text-secondary); }
    .header p strong { color:var(--accent); }

    /* ---- 主体 ---- */
    .body { padding:24px 32px 32px; }

    /* ---- 上传区域 ---- */
    .upload-zone {
      border:2px dashed #d0d6e0;
      border-radius:var(--radius);
      padding:44px 24px;
      text-align:center;
      cursor:pointer;
      transition:all .22s;
      background:#fafbfd;
      margin-bottom:22px;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color:var(--accent);
      background:rgba(14,168,130,.04);
      box-shadow:0 0 0 6px var(--accent-glow);
    }
    .upload-icon {
      font-size:40px; margin-bottom:10px;
      display:block; opacity:.7;
    }
    .upload-zone .hint { font-size:14px; color:var(--text-secondary); margin:0; }
    .upload-zone .hint-sub { font-size:12px; color:var(--text-muted); margin:4px 0 0; }
    .file-input { display:none; }

    /* ---- 文件列表 ---- */
    .section-title {
      font-size:13px; font-weight:700; color:var(--text-muted);
      text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px;
    }

    .file-card {
      display:flex; align-items:center; gap:14px;
      padding:14px 18px;
      border:1px solid var(--border); border-radius:var(--radius);
      margin-bottom:8px;
      background:var(--surface);
      transition:box-shadow .18s;
    }
    .file-card:hover { box-shadow:var(--shadow-sm); }

    .file-icon {
      width:40px; height:40px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0;
    }
    .file-icon.pdf { background:#fef2f2; }
    .file-icon.md  { background:#f0fdf8; }

    .file-info { flex:1; min-width:0; }
    .file-name { font-size:13.5px; font-weight:600; color:var(--text); }
    .file-name span { font-weight:400; color:var(--text-muted); font-size:11.5px; margin-left:6px; }
    .file-meta { font-size:11.5px; color:var(--text-muted); margin-top:3px; }

    .progress-mini {
      height:3px; background:#eef1f6; border-radius:99px; margin-top:6px; overflow:hidden;
    }
    .progress-mini-bar { height:100%; width:0; border-radius:99px; transition:width .4s, background .3s; }

    .status-tag {
      padding:5px 11px; border-radius:99px; font-size:11px; font-weight:700;
      white-space:nowrap; flex-shrink:0;
    }
    .status-tag.uploading { background:#fef3c7; color:#b45309; }
    .status-tag.processing { background:#dbeafe; color:#1e40af; }
    .status-tag.completed  { background:#d1fae5; color:#065f46; }
    .status-tag.failed     { background:#fee2e2; color:#991b1b; }

    .log-toggle {
      font-size:11px; color:var(--accent); cursor:pointer; font-weight:600;
      margin-top:5px; display:inline-block; user-select:none;
    }
    .log-list { margin:6px 0 0; padding:0 0 0 18px; display:none; }
    .log-list.open { display:block; }
    .log-list li { font-size:11.5px; color:var(--text-secondary); margin:2px 0; }

    /* ---- 空状态 ---- */
    .empty-state {
      text-align:center; padding:32px 16px; color:var(--text-muted);
    }
    .empty-state .icon { font-size:36px; display:block; margin-bottom:8px; opacity:.5; }
    .empty-state p { margin:0; font-size:13px; }
  </style>
</head>
<body>

<div class="container">
  <!-- ====== 头部 ====== -->
  <div class="header">
    <div class="logo-mark"><span>知</span></div>
    <h1>知流 RAG · 文件导入</h1>
    <p>支持 <strong>PDF</strong> 与 <strong>Markdown</strong> 文件，自动解析向量入库</p>
  </div>

  <!-- ====== 主体 ====== -->
  <div class="body">
    <!-- 上传区 -->
    <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="upload-icon">📂</span>
      <p class="hint">点击选择文件，或拖拽到此处</p>
      <p class="hint-sub">支持 .pdf / .md 格式，可多选</p>
      <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md" />
    </div>

    <!-- 文件列表 -->
    <div id="fileList">
      <div class="empty-state" id="emptyHint">
        <span class="icon">📋</span>
        <p>暂无上传任务</p>
      </div>
    </div>
  </div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const emptyHint = document.getElementById('emptyHint');
  const API_BASE = 'http://127.0.0.1:8000';

  // ---- 拖拽效果 ----
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  function handleFiles(files) { Array.from(files).forEach(uploadFile); }
  function hideEmpty() { if(emptyHint) emptyHint.style.display='none'; }

  function fileIcon(name) {
    return /\.pdf$/i.test(name) ? '<div class="file-icon pdf">📄</div>' : '<div class="file-icon md">📝</div>';
  }

  function fileType(name) {
    return /\.pdf$/i.test(name) ? 'PDF' : 'Markdown';
  }

  async function uploadFile(file) {
    hideEmpty();
    const id = 'f-' + Math.random().toString(36).slice(2,8);
    const html = `
      <div class="file-card" id="${id}">
        ${fileIcon(file.name)}
        <div class="file-info">
          <div class="file-name">${file.name} <span>${fileType(file.name)}</span></div>
          <div class="file-meta">${(file.size/1024).toFixed(1)} KB</div>
          <div class="progress-mini"><div class="progress-mini-bar"></div></div>
          <span class="log-toggle">▸ 查看日志</span>
          <ul class="log-list"></ul>
        </div>
        <div class="status-tag uploading">上传中</div>
      </div>
    `;
    fileList.insertAdjacentHTML('afterbegin', html);
    const card = document.getElementById(id);
    const statusTag = card.querySelector('.status-tag');
    const progressBar = card.querySelector('.progress-mini-bar');
    const logToggle = card.querySelector('.log-toggle');
    const logList = card.querySelector('.log-list');

    // 切换日志展开
    logToggle.addEventListener('click', e => {
      e.stopPropagation();
      const open = logList.classList.toggle('open');
      logToggle.textContent = open ? '▾ 收起日志' : '▸ 查看日志';
    });

    const formData = new FormData();
    formData.append('files', file);

    try {
      progressBar.style.width = '40%'; progressBar.style.background = '#f59e0b';

      const res = await fetch(`${API_BASE}/upload`, { method:'POST', body:formData });
      if(!res.ok) throw new Error('上传失败');
      const result = await res.json();
      const taskId = result.task_ids[0];

      progressBar.style.width = '20%'; progressBar.style.background = '#3b82f6';
      statusTag.textContent = '处理中';
      statusTag.className = 'status-tag processing';

      pollStatus(taskId, card);
    } catch(e) {
      statusTag.textContent = '失败';
      statusTag.className = 'status-tag failed';
      progressBar.style.background = '#ef4444';
    }
  }

  function renderLogs(card, doneList, runningList) {
    const logToggle = card.querySelector('.log-toggle');
    const logList = card.querySelector('.log-list');
    const done = Array.isArray(doneList) ? doneList : [];
    const running = Array.isArray(runningList) ? runningList : [];
    logToggle.textContent = (logList.classList.contains('open') ? '▾ 收起日志' : '▸ 查看日志') + ` （已完成${done.length}，进行中${running.length}）`;
    logList.innerHTML = '';
    const lines = [...done.map(x => `✅ ${x}`), ...running.map(x => `⏳ ${x}`)];
    if(!lines.length) { const li=document.createElement('li'); li.textContent='等待开始…'; logList.appendChild(li); }
    else lines.forEach(l => { const li=document.createElement('li'); li.textContent=l; logList.appendChild(li); });
  }

  function pollStatus(taskId, card) {
    const statusTag = card.querySelector('.status-tag');
    const progressBar = card.querySelector('.progress-mini-bar');
    const interval = setInterval(async () => {
      try {
        const res = await fetch(`${API_BASE}/status/${taskId}`);
        const data = await res.json();
        renderLogs(card, data.done_list, data.running_list);
        if(data.status === 'completed') {
          statusTag.textContent = '已完成';
          statusTag.className = 'status-tag completed';
          progressBar.style.width = '100%'; progressBar.style.background = '#10b981';
          clearInterval(interval);
        } else if(data.status === 'failed') {
          statusTag.textContent = '失败';
          statusTag.className = 'status-tag failed';
          progressBar.style.background = '#ef4444';
          clearInterval(interval);
        } else {
          progressBar.style.width = '20%'; progressBar.style.background = '#3b82f6';
        }
      } catch(_) {}
    }, 2000);
  }
</script>
</body>
</html>
